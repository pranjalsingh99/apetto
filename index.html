}.main{margin-left:238px}.top{height:61px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:3}.crumb{font-size:11px;color:#97a2b0}.crumb b{color:#3d4d65;margin-left:8px}.top-right{display:flex;align-items:center;gap:18px}.demo{font-size:8px;letter-spacing:.6px;color:#7d8999;background:#f2f4f7;padding:6px 8px;border-radius:5px}.dot{display:inline-block;width:6px;height:6px;background:#e2a243;border-radius:50%;margin-right:5px}.content{max-width:1450px;margin:auto;padding:30px 34px 42px}.hello{display:flex;justify-content:space-between;align-items:center;margin:4px 0 23px}.eyebrow{font-size:9px;letter-spacing:1.1px;color:#8793a4;font-weight:700}.hello h1,.head h1{font:800 25px Manrope;letter-spacing:-.8px;margin:8px 0 5px}.hello p,.head p{font-size:11px;color:#8692a2;margin:0}.btn{border:0;border-radius:8px;background:var(--navy);color:#fff;padding:11px 14px;font-size:11px;font-weight:700}.btn:hover{background:#2c4167}.btn.light{background:white;color:#43536a;border:1px solid #e2e7ed}.btn.purple{background:var(--purple)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:white;border:1px solid var(--line);border-radius:10px;padding:16px}.stat-top{display:flex;align-items:center;justify-content:space-between;color:#8490a0;font-size:10px}.stat-icon{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:#f0eeff;color:#6759dc}.stat-icon.green{background:#e7f6ef;color:#248d72}.stat-icon.blue{background:#eaf3fb;color:#4488c3}.stat-icon.amber{background:#fff3e3;color:#c68a37}.stat strong{display:block;font:800 25px Manrope;margin:7px 0 2px}.stat small{color:#98a3b1;font-size:9px}.bar{height:3px;background:#eff1f4;border-radius:4px;margin-top:10px}.bar i{display:block;height:100%;background:var(--purple);border-radius:4px}.columns{display:grid;grid-template-columns:1.45fr 1fr;gap:13px;margin-top:13px}.card-head :13px}.detected button{border:1px solid #e4e8ef;background:#fafaff;border-radius:15px;padding:7px 10px;font-size:9px;color:#59677d}.detected button:hover{border-color:#8a7fe6}.question{padding:13px 0;border-top:1px solid #eff1f4}.question b{font-size:11px}.answers{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.answers button{background:white;border:1px solid #e5e9ef;border-radius:7px;padding:8px 11px;font-size:10px;color:#637188}.answers button.chosen{background:#f0efff;border-color:#a39ae9;color:#5548c6}.result{margin-top:12px;padding:12px;background:#eaf7f1;border-radius:8px;color:#277b65;font-size:11px}.demand-row{display:grid;grid-template-columns:130px 1fr 45px;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #f0f2f5;font-size:10px}.demand-row .progress{height:8px}.path{display:grid;grid-template-columns:30px 1fr;gap:9px;margin:10px 0}.pathnum{width:26px;height:26px;background:#eeecff;color:#685bd8;border-radius:50%;display:grid;place-items:center;font-size:9px;font-weight:700}.path .card{padding:13px}.path h3{font:700 12px Manrope;margin:0 0 5px}.path p{font-size:9px;color:#8c97a6;margin:0}.toast{position:fixed;bottom:20px;right:20px;background:#183252;color:white;border-radius:8px;padding:12px 16px;box-shadow:0 8px 22px #14284b26;font-size:11px;z-index:10}.modal-bg{position:fixed;inset:0;background:#14284b88;z-index:8;display:grid;place-items:center;padding:15px}.modal{width:min(440px,100%);background:white;border-radius:13px;padding:22px;box-shadow:0 18px 60px #14284b30}.modal h2{font:700 18px Manrope;margin:0 0 6px}.modal p{font-size:10px;color:#8390a0}.modal input{width:100%;padding:10px;border:1px solid #e1e7ee;border-radius:7px;margin:6px 0;font-size:11px}.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.mobile{display:none}
@media(max-width:850px){.sidebar{width:205px}.main{margin-left:205px}.content{padding:24px 18px}.top{padding:0 18px}.columns,.lower{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.sidebar{display:none}.main{margin:0}.top{height:54px;padding:0 14px}.mobile{display:block}.content{padding:20px 13px}.hello{align-items:flex-start}.hello h1,.head h1{font-size:20px}.hello .btn{font-size:0;padding:9px}.hello .btn:after{content:'Profile';font-size:10px}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:21px}.skill-summary{gap:13px}.ring{width:100px;height:100px}.profile-form,.panel-grid{grid-template-columns:1fr}.profile-form .wide{grid-column:auto}.skill-list{grid-template-columns:1fr 1fr}.demand-row{grid-template-columns:95px 1fr 35px}.demo{display:none}}
:focus-visible{outline:3px solid #938af0;outline-offset:2px}.nav button,.btn,.link,.answers button,.detected button{transition:background .16s ease,border-color .16s ease,transform .16s ease}.btn:hover,.detected button:hover{transform:translateY(-1px)}.card{border-radius:12px;box-shadow:0 2px 8px #20314f05}.stat:hover,.role-card:hover{border-color:#d9def0;box-shadow:0 8px 24px #20314f0b}
@media(min-width:1000px){.content{padding:34px 40px}.top{padding-inline:40px}.nav button{font-size:13px;padding-block:11px}.label{font-size:10px}.hello h1,.head h1{font-size:29px}.hello p,.head p{font-size:13px}.eyebrow{font-size:10px}.stat{padding:18px}.stat-top{font-size:12px}.stat strong{font-size:29px}.stat small{font-size:10px}.card{padding:19px}.card-head h3{font-size:16px}.legend div,.steps div{font-size:12px}.jobtext b{font-size:12px}.jobtext small{font-size:10px}.note{font-size:10px}.profile-form label{font-size:12px}.profile-form input,.profile-form select,.search input,.select{font-size:12px;padding:11px}.skill-chip{font-size:11px}.tag{font-size:9px}.panel-title{font-size:16px}.role-card h3{font-size:15px}.role-card p{font-size:11px}.demand-row{font-size:12px}.upload b{font-size:13px}.upload small{font-size:10px}.answers button{font-size:11px}}</style></head><body><div id="app"></div>
<script>
const skills=['Python','SQL','Excel','Power BI','Statistics','Data Visualization','Machine Learning','Communication','HTML','CSS','JavaScript','React','Cloud Computing','Git','Problem Solving','Digital Marketing','Project Management','Linux','Data Analysis','Public Speaking','Cybersecurity','Figma','Java','Critical Thinking'];
const jobs=[{title:'Junior Data Analyst',company:'Northstar Analytics',loc:'Prayagraj / Remote',skills:['Python','SQL','Excel','Power BI'],match:82},{title:'Business Intelligence Associate',company:'Civic Insights',loc:'Lucknow',skills:['SQL','Power BI','Data Visualization','Communication'],match:67},{title:'Python Developer',company:'Pixel Forge',loc:'Remote',skills:['Python','Git','Problem Solving','SQL'],match:73},{title:'Digital Marketing Analyst',company:'BrightPath',loc:'Prayagraj',skills:['Excel','Digital Marketing','Communication'],match:54},{title:'Frontend Developer',company:'Orbit Labs',loc:'Remote',skills:['HTML','CSS','JavaScript','React'],match:41},{title:'Data Science Intern',company:'Open Data Co.',loc:'Kanpur',skills:['Python','Statistics','Machine Learning','SQL'],match:62}];
let page='dashboard',toastTimer,completed=new Set(),mySkills=['Python','SQL','Excel','Communication','Statistics','Data Analysis'];
const icons={dashboard:'▦',profile:'♙',resume:'▤',assessment:'◈',gap:'◎',career:'⌁',learning:'▣',jobs:'▧',demand:'⌖',settings:'⚙'};
const menus=[['Overview','dashboard'],['My Profile','profile'],['Resume & Skills','resume'],['Skill Assessment','assessment'],['Skill Gap','gap'],['Career Path','career'],['Learning Path','learning'],['Job Opportunities','jobs'],['Skill Demand','demand'],['Settings','settings']];
function note(s){clearTimeout(toastTimer);let n=document.getElementById('toast');if(!n){n=document.createElement('div');n.id='toast';n.className='toast';document.body.append(n)}n.textContent=s;toastTimer=setTimeout(()=>n.remove(),2600)}
function go(p){page=p;render();window.scrollTo(0,0)}function card(content,cls=''){return `<section class="card ${cls}">${content}</section>`}function head(ey,title,desc,action=''){return `<div class="head"><div><div class="eyebrow">${ey}</div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}function btn(t,fn,cls='btn'){return `<button class="${cls}" onclick="${fn}">${t}</button>`}
function render(){let view=page==='dashboard'?dashboard():page==='profile'?profile():page==='resume'?resume():page==='assessment'?assessment():page==='gap'?gap():page==='career'?career():page==='learning'?learning():page==='jobs'?jobPage():page==='demand'?demand():settings();document.getElementById('app').innerHTML=`<aside class="sidebar"><div class="brand"><div class="logo">A</div><div><b>Apetto</b><small>SKILLS TO OPPORTUNITIES</small></div></div><div class="label">WORKSPACE</div><nav class="nav">${menus.map(([n,k])=>`<button class="${page===k?'active':''}" onclick="go('${k}')"><span class="ico">${icons[k]}</span>${n}</button>`).join('')}</nav><div class="sidebar-bottom"><div class="help"><b>Need a hand?</b><p>Explore your career toolkit</p><button onclick="go('learning')">Explore resources →</button></div><div class="person"><div class="avatar">P</div><div><b>Pranjal Singh</b><small>Candidate account</small></div><button onclick="note('This is a frontend demo')">⋯</button></div></div></aside><main class="main"><header class="top"><span class="crumb">Workspace <b>/ ${menus.find(x=>x[1]===page)?.[0]||'Overview'}</b></span><div class="top-right"><span class="demo"><i class="dot"></i>DEMO PREVIEW</span><span>♧</span><div class="avatar">P</div></div></header><div class="content">${view}</div></main>`}
function dashboard(){return `<div class="hello"><div><div class="eyebrow">MONDAY, SEPTEMBER 29, 2026</div><h1>Good morning, Pranjal <span style="color:#dda54a">✦</span></h1><p>Your next step is closer than you think. Here’s your career snapshot.</p></div>${btn('View my profile',"go('profile')",'btn light')}</div><div class="stats">${[['Profile completeness','72%','A good foundation','♙',''],['Verified skills','04','Skills you can stand behind','◈','green'],['Role alignment','67%','Based on your target role','◎','blue'],['Career readiness','72%','An indicative demo score','↗','amber']].map(x=>`<div class="card stat"><div class="stat-top">${x[0]}<span class="stat-icon ${x[4]}">${x[3]}</span></div><strong>${x[1]}</strong><small>${x[2]}</small><div class="bar"><i style="width:${x[1].replace('%','')}%"></i></div></div>`).join('')}</div><div class="columns">${card(`<div class="card-head"><div><div class="eyebrow">YOUR CAREER SNAPSHOT</div><h3>Skills that move you forward</h3></div><button class="link" onclick="go('resume')">View all skills →</button></div><div class="skill-summary"><div class="ring"><div><b>67%</b><small>role match</small></div></div><div class="legend"><div><i class="bullet"></i>Matched skills <strong>4</strong></div><div><i class="bullet p"></i>Skills to build <strong>4</strong></div><div><i class="bullet g"></i>Profile skills <strong>6</strong></div>${btn('See my skill gaps →',"go('gap')",'btn smallbtn')}</div></div>`)}${card(`<div class="eyebrow">✦ &nbsp; A NOTE ON YOUR SCORE</div><h3>Good foundations.<br>Room to grow.</h3><p>Your readiness score brings together verified skills, assessment results, and your profile. It’s a helpful guide, not a final verdict.</p><button class="link" onclick="go('gap')">Understand your score →</button>`,'insight')}</div><div class="lower"><div class="card"><div class="card-head"><div><div class="eyebrow">RECOMMENDED FOR YOU</div><h3>Roles that fit your skills</h3></div><button class="link" onclick="go('jobs')">All opportunities →</button></div><div class="jobs">${jobs.slice(0,3).map((j,i)=>`<div class="jobrow"><div class="company">${j.company[0]}</div><div class="jobtext"><b>${j.title}</b><small>${j.company} · ${j.loc}</small></div><div class="match">${j.match}%<small>match</small></div></div>`).join('')}</div></div>${card(`<div class="eyebrow">SMALL STEPS, REAL MOMENTUM</div><h3 class="panel-title" style="margin-top:6px">Build your next skill</h3><p style="font-size:10px;color:#8692a2">A few focused skills can bring your Data Analyst goal into sharper focus.</p><div class="steps"><div><i></i>Power BI</div><div><i></i>Statistics</div><div><i></i>Data Visualization</div></div>${btn('Explore learning path →',"go('learning')",'btn smallbtn')}</div>`,'')}</div><div class="note"><span>✦</span> Readiness is an indicative demo score. Keep learning; your path can change as you do.</div>`}
function profile(){return `${head('YOUR FOUNDATION','My profile','A little context helps connect your skills to the right opportunities.')}${card(`<div class="profile-form"><label>Full name<input value="Pranjal Singh"></label><label>Email address<input value="pranjal.singh@example.com"></label><label>Location / district<input value="Prayagraj"></label><label>Education<input value="B.Sc. Statistics"></label><label>Current status<select><option>Student</option><option>Employed</option><option>Looking for work</option></select></label><label>Experience level<select><option>Entry level</option><option>1–3 years</option><option>3–5 years</option></select></label><label class="wide">Target career role<select><option>Data Analyst</option><option>Business Intelligence Associate</option><option>Python Developer</option></select></label><label class="wide">Career interests<input placeholder="What kind of work interests you?"></label></div><div style="display:flex;justify-content:flex-end;margin-top:16px">${btn('Save profile',"note('Profile saved in this preview')")}</div>`)}`}
function resume(){return `${head('YOUR EXPERIENCE, IN YOUR WORDS','Resume & skills','Add skills to your profile and explore your demo skill library.')}${card(`<h3 class="panel-title">Share your resume</h3><p style="font-size:10px;color:#8793a4">This preview does not upload files to a server. You can still explore the suggested-skill interaction.</p><label class="upload"><input type="file" accept=".pdf,.txt,.doc,.docx" onchange="extractResume(this.files[0])"><span style="font-size:20px;color:#6c5fe0">⇧</span><b>Choose a file or drop it here</b><small>PDF, DOCX or TXT · demo text scan</small></label><div id="detected-resume-skills"></div><h3 class="panel-title" style="margin-top:20px">My skills <span class="tag">${mySkills.length} skills</span></h3><div class="skill-list">${mySkills.map(s=>`<div class="skill-chip">${s}<span class="tag ${['Power BI','Statistics','Data Visualization'].includes(s)?'grow':''}">${['Python','SQL','Excel','Data Analysis'].includes(s)?'Verified':'Self-declared'}</span></div>`).join('')}</div><button class="link" style="margin-top:14px" onclick="showSkillPicker()">＋ Add a skill</button><div id="picker"></div>`)}`}
function showSkillPicker(){document.getElementById('picker').innerHTML=`<div style="display:flex;gap:8px;margin-top:12px"><select id="newskill" class="select">${skills.filter(s=>!mySkills.includes(s)).map(s=>`<option>${s}</option>`).join('')}</select><button class="btn purple" onclick="addSkill()">Add skill</button></div>`}function addSkill(){let x=document.getElementById('newskill').value;if(x&&!mySkills.includes(x))mySkills.push(x);note(x+' added to your skills');go('resume')}
function assessment(){return `${head('SHOW WHAT YOU KNOW','Skill assessment','A quick demo knowledge check. Your answers stay in this page preview.')}${card(`<div class="eyebrow">3 QUESTIONS · DEMO ASSESSMENT</div><h3 class="panel-title" style="margin-top:8px">Check your knowledge</h3><label style="font-size:10px;color:#8591a1">CHOOSE A SKILL <select class="select"><option>Python</option><option>SQL</option><option>Excel</option></select></label>${[['Which type is commonly used for a sequence in Python?',['tuple','list','integer','boolean'],1],['Which SQL clause filters rows?',['ORDER BY','GROUP BY','WHERE','JOIN'],2],['What does a median describe?',['Average of squares','Most frequent value','Middle value','Largest value'],2]].map((q,i)=>`<div class="question"><b>0${i+1} &nbsp; ${q[0]}</b><div class="answers">${q[1].map((a,j)=>`<button onclick="pick(this,${i},${j})">${a}</button>`).join('')}</div></div>`).join('')}<button class="btn" onclick="scoreQuiz()">Submit assessment →</button><div id="score"></div>`)}`}
let chosen=[-1,-1,-1];function pick(el,i,j){el.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('chosen'));el.classList.add('chosen');chosen[i]=j}function scoreQuiz(){let n=chosen.reduce((a,b,i)=>a+([1,2,2][i]===b?1:0),0),s=Math.round(n/3*100);document.getElementById('score').innerHTML=`<div class="result">Your demo score: <b>${s}%</b> · ${s>=80?'Advanced':s>=55?'Intermediate':'Beginner'} · ${s>=60?'Skill verified':'Keep practicing'}</div>`}
function gap(){let gaps=['Power BI','Statistics','Data Visualization'];return `${head('SEE THE DISTANCE, FIND THE WAY','Skill gap analysis','Compare your skills with what your target role commonly asks for.')}${card(`<div class="card-head"><div><div class="eyebrow">YOUR TARGET ROLE</div><h3>Data Analyst</h3></div><span class="tag">67% skill match</span></div><div style="margin-top:14px">${['Python','SQL','Excel','Power BI','Statistics','Data Visualization'].map((s,i)=>`<div class="demand-row"><span>${s}</span><div class="progress"><i style="width:${[100,100,100,32,15,10][i]}%;background:${i<3?'#279879':'#e2a74d'}"></i></div><span class="tag ${i<3?'':'grow'}">${i<3?'Matched':'To build'}</span></div>`).join('')}</div><div class="note">✦ &nbsp; Curated demo mapping inspired by NCO / NSQF frameworks; not an official classification.</div><button class="btn smallbtn" onclick="go('learning')">Build my learning path →</button>`)}`}
function career(){return `${head('PICTURE THE POSSIBILITIES','Career path','Explore how roles can connect as your skills and experience grow.')}${card(`<div class="eyebrow">A PATH TO EXPLORE</div><h3 class="panel-title" style="margin-top:8px">From your starting point to your next horizon.</h3><p style="font-size:10px;color:#8793a4">A sample career path for a Data Analyst.</p>${[['Junior Data Analyst','Excel · SQL · Data Analysis','A possible starting point'],['Data Analyst','Python · SQL · Power BI','Your selected target'],['Senior Data Analyst','Data Visualization · Communication','A step along the way'],['Data Scientist','Statistics · Machine Learning','A longer-term direction']].map((r,i)=>`<div class="path"><div class="pathnum">0${i+1}</div><div class="card"><h3>${r[0]}</h3><p>${r[1]} · ${r[2]}</p></div></div>`).join('')}`)}`}
function learning(){let list=[['Excel','Excel foundations','Microsoft Learn','5 hours'],['Statistics','Statistics for data analysis','Khan Academy','6 hours'],['Power BI','Power BI essentials','Microsoft Learn','4 hours'],['Data Visualization','Tell stories with data','OpenLearn','3 hours'],['SQL','SQL practice lab','SQLBolt','4 hours']];return `${head('A PLAN THAT MOVES WITH YOU','Learning path','A practical demo sequence for your Data Analyst goal.')}${card(`<div class="eyebrow">YOUR LEARNING DESTINATION</div><h3 class="panel-title" style="margin-top:7px">Data Analyst</h3>${list.map((x,i)=>`<div class="jobrow"><div class="pathnum">0${i+1}</div><div class="jobtext"><b>${x[0]}</b><small>${x[1]} · ${x[2]} · ${x[3]}</small></div><button class="btn light" onclick="this.textContent='✓ Done';this.disabled=true;note('${x[0]} marked complete')">Mark complete</button></div>`).join('')}<div class="note">Learning resources shown are examples. Check provider availability and cost before enrolling.</div>`)}`}
function jobPage(){return `${head('OPPORTUNITIES TO EXPLORE','Job opportunities','Sample roles ranked by how closely your skills line up.','<span class="demo">SAMPLE LISTINGS</span>')}<div class="search"><input id="jobsearch" placeholder="Search roles, companies, skills…" oninput="filterJobs()"><select class="select" onchange="filterJobs()" id="location"><option>All locations</option><option>Prayagraj</option><option>Remote</option><option>Lucknow</option></select></div><div class="panel-grid" id="jobgrid">${jobCards(jobs)}</div>`}function jobCards(list){return list.map(j=>card(`<div class="card-head"><div class="company">${j.company[0]}</div><span class="tag">${j.match}% match</span></div><h3>${j.title}</h3><p>${j.company} · ${j.loc}</p><div class="skill-tags">${j.skills.map(s=>`<span>${s}</span>`).join('')}</div><div class="progress"><i style="width:${j.match}%"></i></div><button class="link" style="margin-top:12px" onclick="note('Sample listing — contact the company directly')">View opportunity ↗</button>`,'role-card')).join('')}function filterJobs(){let q=document.getElementById('jobsearch').value.toLowerCase(),loc=document.getElementById('location').value,items=jobs.filter(j=>(j.title+j.company+j.skills.join(' ')).toLowerCase().includes(q)&&(loc==='All locations'||j.loc.toLowerCase().includes(loc.toLowerCase())));document.getElementById('jobgrid').innerHTML=jobCards(items)||'<p>No matching sample roles.</p>'}
function demand(){let data=[['Data Analysis',88,'+12%'],['Web Development',76,'+9%'],['Cloud Computing',61,'+15%'],['Digital Marketing',55,'+6%']];return `${head('LOCAL SKILL INTELLIGENCE','Skill demand','Explore an illustrative sample of skills for Prayagraj.','<span class="demo"><i class="dot"></i>DEMO DATA · NOT LIVE</span>')}${card(`<div class="card-head"><div><div class="eyebrow">DISTRICT SPOTLIGHT</div><h3>Prayagraj</h3></div><select class="select" onchange="note('Sample demand is available for Prayagraj, Lucknow and Varanasi')"><option>Prayagraj</option><option>Lucknow</option><option>Varanasi</option></select></div><div style="margin-top:16px">${data.map(x=>`<div class="demand-row"><b>${x[0]}</b><div class="progress"><i style="width:${x[1]}%;background:#6e61df"></i></div><span style="color:#238b70">${x[2]}</span></div>`).join('')}</div><div class="note">All values shown are curated demo data, not live market signals.</div>`)}${card(`<div class="eyebrow">INDUSTRY FEEDBACK LOOP</div><h3 class="panel-title" style="margin-top:8px">Demand informs learning. Learning informs opportunity.</h3><p style="font-size:10px;color:#8994a4">Industry demand → Job data → Skill gap analysis → Training recommendations → Industry feedback → Updated skill demand</p>`)}`}
function settings(){return `${head('YOUR ACCOUNT','Settings','Manage your demo preferences.')}${card(`<h3 class="panel-title">Demo environment</h3><p style="font-size:10px;color:#8793a4">This is a frontend-only preview. Your profile, added skills and learning progress stay saved in this browser.</p><span class="tag">No account or password needed</span>`)}`}
try{mySkills=JSON.parse(localStorage.getItem('apetto_skills'))||mySkills;completed=new Set(JSON.parse(localStorage.getItem('apetto_completed'))||[]);profileData=JSON.parse(localStorage.getItem('apetto_profile'))||{name:'Pranjal Singh',email:'pranjal.singh@example.com',district:'Prayagraj',education:'B.Sc. Statistics',status:'Student',experience:'Entry level',target:'Data Analyst',interests:''}}catch{profileData={name:'Pranjal Singh',email:'pranjal.singh@example.com',district:'Prayagraj',education:'B.Sc. Statistics',status:'Student',experience:'Entry level',target:'Data Analyst',interests:''}}
function saveProfile(){profileData={name:document.getElementById('p-name').value,email:document.getElementById('p-email').value,district:document.getElementById('p-district').value,education:document.getElementById('p-education').value,status:document.getElementById('p-status').value,experience:document.getElementById('p-experience').value,target:document.getElementById('p-target').value,interests:document.getElementById('p-interests').value};localStorage.setItem('apetto_profile',JSON.stringify(profileData));render();note('Profile saved on this device')}
function profile(){return `${head('YOUR FOUNDATION','My profile','A little context helps connect your skills to the right opportunities.')}${card(`<div class="profile-form"><label>Full name<input id="p-name" value="${profileData.name}"></label><label>Email address<input id="p-email" value="${profileData.email}"></label><label>Location / district<input id="p-district" value="${profileData.district}"></label><label>Education<input id="p-education" value="${profileData.education}"></label><label>Current status<select id="p-status">${['Student','Employed','Looking for work'].map(x=>`<option ${profileData.status===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Experience level<select id="p-experience">${['Entry level','1–3 years','3–5 years'].map(x=>`<option ${profileData.experience===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="wide">Target career role<select id="p-target">${['Data Analyst','Business Intelligence Associate','Python Developer'].map(x=>`<option ${profileData.target===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="wide">Career interests<input id="p-interests" value="${profileData.interests}" placeholder="What kind of work interests you?"></label></div><div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="btn" onclick="saveProfile()">Save profile</button></div>`)}`}
function addSkill(){let x=document.getElementById('newskill').value;if(x&&!mySkills.includes(x))mySkills.push(x);localStorage.setItem('apetto_skills',JSON.stringify(mySkills));note(x+' added to your skills');go('resume')}
function extractResume(file){if(!file)return;if(file.size>5000000){note('Choose a file under 5 MB');return}let reader=new FileReader();reader.onload=()=>{let raw=reader.result instanceof ArrayBuffer?new TextDecoder('latin1').decode(reader.result):String(reader.result||''),text=raw.toLowerCase(),found=skills.filter(s=>text.includes(s.toLowerCase()));if(!found.length)found=['Python','SQL','Data Analysis'];let box=document.getElementById('detected-resume-skills');if(box)box.innerHTML=`<div class="note">DEMO SUGGESTIONS — review before adding</div><div class="detected">${found.map(s=>`<button onclick="confirmExtractedSkill('${s}')">＋ ${s}</button>`).join('')}</div>`;note(found.length+' possible skills found — review them below')};file.type==='application/pdf'?reader.readAsArrayBuffer(file):reader.readAsText(file)}
function confirmExtractedSkill(skill){if(!mySkills.includes(skill))mySkills.push(skill);localStorage.setItem('apetto_skills',JSON.stringify(mySkills));note(skill+' added to your skills');go('resume')}
function markComplete(skill){completed.add(skill);localStorage.setItem('apetto_completed',JSON.stringify([...completed]));render();note(skill+' marked complete')}
function learning(){let list=[['Excel','Excel foundations','Microsoft Learn','5 hours'],['Statistics','Statistics for data analysis','Khan Academy','6 hours'],['Power BI','Power BI essentials','Microsoft Learn','4 hours'],['Data Visualization','Tell stories with data','OpenLearn','3 hours'],['SQL','SQL practice lab','SQLBolt','4 hours']];return `${head('A PLAN THAT MOVES WITH YOU','Learning path','A practical demo sequence for your Data Analyst goal.')}${card(`<div class="eyebrow">YOUR LEARNING DESTINATION</div><h3 class="panel-title" style="margin-top:7px">Data Analyst · ${completed.size}/${list.length} steps complete</h3>${list.map((x,i)=>`<div class="jobrow"><div class="pathnum">0${i+1}</div><div class="jobtext"><b>${x[0]}</b><small>${x[1]} · ${x[2]} · ${x[3]}</small></div><button class="btn light" ${completed.has(x[0])?'disabled':''} onclick="markComplete('${x[0]}')">${completed.has(x[0])?'✓ Done':'Mark complete'}</button></div>`).join('')}<div class="note">Learning resources shown are examples. Check provider availability and cost before enrolling.</div>`)}`}
profileData.name='Pranjal Singh';profileData.email='pranjal.singh@example.com';
render();
</script></body></html>
